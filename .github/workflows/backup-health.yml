name: KTS backup monitor

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: Send a test email after a successful check
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '45 3 * * *'

permissions:
  contents: read

concurrency:
  group: kts-backup-monitor
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    name: Verify KTS backups independently
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the latest local and Yandex restores on the REG server
        shell: bash
        env:
          REG_BACKUP_MONITOR_KEY: ${{ secrets.REG_BACKUP_MONITOR_KEY }}
          REG_BACKUP_MONITOR_HOSTKEY: ${{ secrets.REG_BACKUP_MONITOR_HOSTKEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          keydir="$(mktemp -d "$RUNNER_TEMP/reg-backup.XXXXXX")"
          trap 'rm -f -- "$keydir/id" "$keydir/known_hosts" "$keydir/status"; rmdir -- "$keydir"' EXIT
          test -n "$REG_BACKUP_MONITOR_KEY" || { echo '::error::REG_BACKUP_MONITOR_KEY is missing'; exit 1; }
          printf '%s\n' "$REG_BACKUP_MONITOR_KEY" > "$keydir/id"
          unset REG_BACKUP_MONITOR_KEY
          read -r host algorithm host_key extra <<< "$REG_BACKUP_MONITOR_HOSTKEY"
          [[ "$host" =~ ^[0-9]+(\.[0-9]+){3}$ && "$algorithm" == ssh-ed25519 && -n "$host_key" && -z "$extra" ]]
          printf '%s %s %s\n' "$host" "$algorithm" "$host_key" > "$keydir/known_hosts"
          # The key is restricted to a single read-only command on the VPS.
          timeout 4m ssh -F /dev/null -nT -i "$keydir/id" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$keydir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15 \
            "kts-backup-monitor@$host" backup-status > "$keydir/status"
          # Compare the VPS timestamps to the runner's independent UTC clock.
          python3 - "$keydir/status" <<'PY'
          import datetime as dt, json, sys
          with open(sys.argv[1]) as stream:
              report = json.load(stream)
          if report.get('ok') is not True:
              sys.exit('Incomplete REG backup verification')
          now = dt.datetime.now(dt.timezone.utc)
          for field in ('capture', 'localRestore', 'cloudRestore', 'health'):
              stamp = dt.datetime.fromisoformat(report[field].replace('Z', '+00:00'))
              if not -300 <= (now - stamp).total_seconds() < (2700 if field == 'health' else 108000):
                  sys.exit('Stale REG backup evidence: ' + field)
              print(field, stamp.isoformat())
          PY

  notify:
    name: Independent failure email
    needs: monitor
    if: ${{ always() && (needs.monitor.result != 'success' || inputs.test_email == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout notifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate independent email settings
        shell: bash
        env:
          SMTP_HOST: ${{ secrets.BACKUP_SMTP_HOST }}
          SMTP_USER: ${{ secrets.BACKUP_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.BACKUP_SMTP_PASSWORD }}
        run: |
          set -Eeuo pipefail
          for key in SMTP_HOST SMTP_USER SMTP_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Independent backup email is not configured: BACKUP_${key} secret is required. Recipient: ktsmarketolog@yandex.ru"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ops/backup/package-lock.json

      - name: Install locked notifier dependencies
        run: npm ci --prefix ops/backup --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Send email without depending on production SSH or SMTP configuration
        env:
          KTS_ALERT_SOURCE: github
          SMTP_HOST: ${{ secrets.BACKUP_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.BACKUP_SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.BACKUP_SMTP_SECURE }}
          SMTP_USER: ${{ secrets.BACKUP_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.BACKUP_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.BACKUP_SMTP_FROM }}
          KTS_ALERT_EVENT: ${{ needs.monitor.result == 'success' && 'test' || 'independent-monitor-failed' }}
        run: node ops/backup/notify.cjs "$KTS_ALERT_EVENT"
