name: Deploy KTS

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: kts-production-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/kts_deploy
          chmod 600 ~/.ssh/kts_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env*' \
            --exclude='.next/' \
            --exclude='node_modules/' \
            --exclude='public/uploads/' \
            -e "ssh -i ~/.ssh/kts_deploy -o IdentitiesOnly=yes" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/"

      - name: Build and restart on server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kts_deploy -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.VPS_PROJECT_PATH }}' && npm ci --include=dev && npm run build && pm2 startOrRestart ecosystem.config.cjs --update-env"
