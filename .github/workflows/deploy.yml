name: Deploy KTS

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: kts-production-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          test -n "${{ secrets.VPS_HOST }}" || (echo "::error title=Missing repository secret::VPS_HOST is required" && exit 1)
          test -n "${{ secrets.VPS_USER }}" || (echo "::error title=Missing repository secret::VPS_USER is required" && exit 1)
          test -n "${{ secrets.VPS_PROJECT_PATH }}" || (echo "::error title=Missing repository secret::VPS_PROJECT_PATH is required" && exit 1)
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "::error title=Missing repository secret::VPS_SSH_KEY is required" && exit 1)

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/kts_deploy
          chmod 600 ~/.ssh/kts_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Check SSH connection
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kts_deploy -o IdentitiesOnly=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo Connected to VPS as \$(whoami)" || \
            (echo "::error title=SSH connection failed::Check VPS_HOST, VPS_USER, VPS_SSH_KEY and authorized_keys on the server" && exit 1)

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Verify project
        run: |
          set -euo pipefail
          npm run lint
          npm test
          npx tsc --noEmit --incremental false
          npm audit --omit=dev --audit-level=high

      - name: Build application
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
          SITE_URL: https://kts-impex.ru
          YANDEX_SITE_VERIFICATION: ${{ secrets.YANDEX_SITE_VERIFICATION }}
        run: |
          set -euo pipefail
          npm run build:webpack
          node scripts/verify-yandex-metadata.mjs

      - name: Prepare release artifact
        run: |
          set -euo pipefail
          RELEASE_ID="$(date -u +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

          rm -rf deploy-artifact
          mkdir -p deploy-artifact/.next deploy-artifact/public deploy-artifact/scripts

          cp -R .next/standalone/. deploy-artifact/
          cp -R .next/static deploy-artifact/.next/static
          rsync -a --exclude='uploads/' public/ deploy-artifact/public/
          cp ecosystem.config.cjs deploy-artifact/ecosystem.config.cjs
          cp scripts/verify-production-seo.mjs deploy-artifact/scripts/verify-production-seo.mjs
          printf '%s\n' "$RELEASE_ID" > deploy-artifact/.release-id

          tar -czf "kts-release-${RELEASE_ID}.tar.gz" -C deploy-artifact .

      - name: Upload release artifact
        run: |
          set -euo pipefail
          scp -i ~/.ssh/kts_deploy -o IdentitiesOnly=yes \
            "kts-release-${RELEASE_ID}.tar.gz" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/kts-release-${RELEASE_ID}.tar.gz"

      - name: Activate release on server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kts_deploy -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "PROJECT_PATH='${{ secrets.VPS_PROJECT_PATH }}' RELEASE_ID='${RELEASE_ID}' bash -s" <<'EOF'
          set -euo pipefail

          export PATH="$HOME/.npm-global/bin:$PATH"
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          command -v pm2 >/dev/null || npm install -g pm2

          BASE="$PROJECT_PATH"
          RELEASES="$BASE/releases"
          SHARED="$BASE/shared"
          CURRENT="$BASE/current"
          PREVIOUS="$BASE/previous"
          RELEASE="$RELEASES/$RELEASE_ID"
          ARCHIVE="/tmp/kts-release-$RELEASE_ID.tar.gz"
          ROLLBACK_TARGET=""
          ACTIVATION_STARTED=0

          wait_for_url() {
            url="$1"
            label="$2"
            attempts="${3:-120}"
            for attempt in $(seq 1 "$attempts"); do
              if curl --fail --silent --show-error --max-time 4 "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo "$label did not become ready after ${attempts}s: $url"
            return 1
          }

          main_app_mode() {
            pm2 jlist | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const app = JSON.parse(input).find((entry) => entry.name === "kts-next-admin");
                if (app) process.stdout.write(app.pm2_env.exec_mode || "unknown");
              });
            '
          }

          main_app_pids() {
            pm2 jlist | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                JSON.parse(input)
                  .filter((entry) => entry.name === "kts-next-admin" && entry.pm2_env.status === "online")
                  .forEach((entry) => console.log(entry.pid));
              });
            '
          }

          rollback_on_exit() {
            status=$?
            trap - EXIT

            if [ "$status" -eq 0 ]; then
              exit "$status"
            fi

            set +e
            pm2 delete kts-next-admin-canary >/dev/null 2>&1 || true
            if [ "$ACTIVATION_STARTED" != "1" ]; then
              exit "$status"
            fi

            echo "Release activation failed; rolling back to the previous release."
            echo "Failed release logs:"
            pm2 logs kts-next-admin --lines 120 --nostream || true
            pm2 delete kts-next-admin >/dev/null 2>&1 || true

            if [ -n "$ROLLBACK_TARGET" ] && [ -d "$ROLLBACK_TARGET" ]; then
              ln -sfn "$ROLLBACK_TARGET" "$CURRENT"
              pm2 start "$CURRENT/ecosystem.config.cjs" --update-env
              wait_for_url "http://127.0.0.1:3000/" "Rollback application" 120
              pm2 save
              echo "Rollback completed: $ROLLBACK_TARGET"
            else
              echo "Rollback target is unavailable; manual recovery is required."
            fi

            exit "$status"
          }

          trap rollback_on_exit EXIT

          if systemctl is-active --quiet kts-next-admin.service 2>/dev/null; then
            echo "Legacy systemd service kts-next-admin.service is active and occupies port 3000."
            echo "Disable it on the VPS before deploying with PM2:"
            echo "sudo systemctl disable --now kts-next-admin.service"
            exit 1
          fi

          FIRMWARE_PUBLIC_PATH="klimatika/prog/firmware/update"

          mkdir -p \
            "$RELEASES" \
            "$SHARED/public/uploads" \
            "$SHARED/public/$FIRMWARE_PUBLIC_PATH" \
            "$SHARED/runtime-data/top-dashboard"
          chmod 700 "$SHARED/runtime-data" "$SHARED/runtime-data/top-dashboard"

          if [ -d "$BASE/public/uploads" ] && [ ! -e "$SHARED/public/uploads/.migrated-from-legacy" ]; then
            cp -a "$BASE/public/uploads/." "$SHARED/public/uploads/" 2>/dev/null || true
            touch "$SHARED/public/uploads/.migrated-from-legacy"
          fi

          if [ -d "$BASE/public/$FIRMWARE_PUBLIC_PATH" ]; then
            cp -an "$BASE/public/$FIRMWARE_PUBLIC_PATH/." "$SHARED/public/$FIRMWARE_PUBLIC_PATH/" 2>/dev/null || true
          fi

          rm -rf "$RELEASE"
          mkdir -p "$RELEASE"
          tar -xzf "$ARCHIVE" -C "$RELEASE"
          rm -f "$ARCHIVE"

          if [ -f "$BASE/.env.local" ]; then
            ln -sfn "$BASE/.env.local" "$RELEASE/.env.local"
          fi

          mkdir -p "$RELEASE/public"
          if [ -d "$RELEASE/public/$FIRMWARE_PUBLIC_PATH" ]; then
            cp -an "$RELEASE/public/$FIRMWARE_PUBLIC_PATH/." "$SHARED/public/$FIRMWARE_PUBLIC_PATH/" 2>/dev/null || true
          fi
          rm -rf "$RELEASE/public/uploads"
          ln -sfn "$SHARED/public/uploads" "$RELEASE/public/uploads"
          mkdir -p "$(dirname "$RELEASE/public/$FIRMWARE_PUBLIC_PATH")"
          rm -rf "$RELEASE/public/$FIRMWARE_PUBLIC_PATH"
          ln -sfn "$SHARED/public/$FIRMWARE_PUBLIC_PATH" "$RELEASE/public/$FIRMWARE_PUBLIC_PATH"
          rm -rf "$RELEASE/runtime-data"
          ln -sfn "$SHARED/runtime-data" "$RELEASE/runtime-data"

          if [ -L "$CURRENT" ] || [ -e "$CURRENT" ]; then
            CURRENT_TARGET="$(readlink -f "$CURRENT" || true)"
            if [ -n "$CURRENT_TARGET" ] && [ -d "$CURRENT_TARGET" ]; then
              ROLLBACK_TARGET="$CURRENT_TARGET"
              ln -sfn "$CURRENT_TARGET" "$PREVIOUS"
            fi
          fi

          EXISTING_MODE="$(main_app_mode)"
          pm2 delete kts-next-admin-canary >/dev/null 2>&1 || true
          KTS_PM2_CANARY=1 KTS_PM2_PORT=3001 \
            pm2 start "$RELEASE/ecosystem.config.cjs" --only kts-next-admin-canary --update-env
          CANARY_PID="$(pm2 pid kts-next-admin-canary | awk '$1 ~ /^[0-9]+$/ && $1 != 0 { print $1; exit }')"
          if [ -n "$CANARY_PID" ]; then
            renice 10 -p "$CANARY_PID" >/dev/null
          fi
          wait_for_url \
            "http://127.0.0.1:3001/api/health/ready" \
            "Release canary" \
            120
          env \
            SEO_REQUIRE_YANDEX_VERIFICATION=1 \
            SEO_REQUIRE_CATALOG_ENTITIES=1 \
            SEO_SMOKE_CONCURRENCY=2 \
            nice -n 10 node \
              "$RELEASE/scripts/verify-production-seo.mjs" \
              "http://127.0.0.1:3001" \
              "https://kts-impex.ru"
          pm2 delete kts-next-admin-canary

          if [ -z "$EXISTING_MODE" ] && ss -ltn 'sport = :3000' 2>/dev/null | grep -q LISTEN; then
            echo "Port 3000 is occupied by a process not managed as kts-next-admin; refusing to kill it."
            exit 1
          fi

          ACTIVATION_STARTED=1
          ln -sfn "$RELEASE" "$CURRENT"

          if [ "$EXISTING_MODE" = "cluster_mode" ]; then
            echo "Reloading the existing PM2 cluster one worker at a time."
            pm2 startOrReload "$CURRENT/ecosystem.config.cjs" --only kts-next-admin --update-env
          elif [ -n "$EXISTING_MODE" ]; then
            echo "Performing the one-time cutover from PM2 fork mode to cluster mode."
            pm2 delete kts-next-admin
            pm2 start "$CURRENT/ecosystem.config.cjs" --only kts-next-admin --update-env
          else
            pm2 start "$CURRENT/ecosystem.config.cjs" --only kts-next-admin --update-env
          fi

          wait_for_url \
            "http://127.0.0.1:3000/api/health/ready" \
            "Production application" \
            120

          FINAL_MODE="$(main_app_mode)"
          if [ "$FINAL_MODE" != "cluster_mode" ]; then
            echo "PM2 application mode is $FINAL_MODE, expected cluster_mode."
            pm2 logs kts-next-admin --lines 80 --nostream || true
            exit 1
          fi

          APP_PIDS="$(main_app_pids)"
          PID_COUNT="$(printf '%s\n' "$APP_PIDS" | awk 'NF { count += 1 } END { print count + 0 }')"
          if [ "$PID_COUNT" -ne 2 ]; then
            echo "PM2 has $PID_COUNT online workers, expected 2."
            pm2 logs kts-next-admin --lines 80 --nostream || true
            exit 1
          fi
          for APP_PID in $APP_PIDS; do
            APP_CWD="$(readlink -f "/proc/$APP_PID/cwd" 2>/dev/null || true)"
            if [ "$APP_CWD" != "$RELEASE" ]; then
              echo "PM2 worker $APP_PID started from unexpected cwd: $APP_CWD, expected: $RELEASE"
              pm2 logs kts-next-admin --lines 80 --nostream || true
              exit 1
            fi
          done

          pm2 save

          ACTIVATION_STARTED=0
          trap - EXIT

          cd "$RELEASES"
          ls -1dt */ | tail -n +3 | xargs -r rm -rf
          EOF
